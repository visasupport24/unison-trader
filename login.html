<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Unison Trading</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <nav>
        <div class="logo"><i class="fa-solid fa-chart-line"></i> UNISON TRADING</div>
        <div class="nav-buttons">
            <a href="/" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back</a>
        </div>
    </nav>

    <div class="auth-container">
        <h2 style="text-align: center; color: var(--accent-gold); margin-bottom: 25px; font-size: 24px;">Welcome Back</h2>
        
        <form action="/api/login" method="POST">
            <div class="form-group">
                <label>Email Address / Phone</label>
                <input type="text" name="email" placeholder="Enter email or phone" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px;"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
        </form>
        <p style="text-align: center; font-size: 13px; color: #94a3b8; margin-top: 20px;">
            Don't have an account? <a href="/register" style="color: var(--accent-gold); text-decoration: none; font-weight: bold;">Sign Up</a>
        </p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNISON TRADING - Login</title>
    <!-- সিএসএস ফাইল লিঙ্ক (সব ফাইল একই জায়গায় থাকবে) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হোম পেজে ফিরে যাওয়ার জন্য টপ হেডার (নিখুঁত কানেকশন) -->
    <header class="auth-header" style="padding: 20px; text-align: center;">
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit; font-weight:bold; font-size:24px;">UNISON TRADING</a></div>
    </header>

    <div class="auth-container">
        <h2>Login Page</h2>
        <form id="loginForm">
            <!-- ইমেইল বা ফোন ইনপুট -->
            <div class="input-group">
                <label for="email_phone">Email / Phone</label>
                <input type="text" id="email_phone" placeholder="Enter Email or Phone" required>
            </div>
            
            <!-- পাসওয়ার্ড ইনপুট -->
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>

            <!-- ফরগট পাসওয়ার্ড অপশন -->
            <div class="auth-options">
                <a href="#" class="forgot-link" onclick="alert('Contact with support team.')">Forget Password</a>
            </div>

            <!-- লগইন বাটন -->
            <button type="submit" id="loginBtn" class="auth-btn">Login</button>
        </form>
        
        <!-- রাউটিং লিঙ্ক পরিবর্তন করে register.html করা হলো -->
        <p>New user? <a href="register.html">Sign Up</a></p>
    </div>

    <!-- ফ্রন্টএন্ড থেকে ব্যাকএন্ড এপিআই-তে লগইন ডেটা পাঠানোর জাভাস্ক্রিপ্ট -->
    <script>
        // আগে থেকে ইউজার লগইন করা থাকলে সরাসরি ড্যাশবোর্ড এইচটিএমএল ফাইলে পাঠিয়ে দেবে
        if (localStorage.getItem('isLoggedIn') === 'true') {
            // যদি আগে থেকে অ্যাডমিন হিসেবে লগইন করা থাকে তবে অ্যাডমিন পেজে যাবে
            if (localStorage.getItem('userRole') === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loginBtn = document.getElementById('loginBtn');
            const email_phone = document.getElementById('email_phone').value.trim();
            const password = document.getElementById('password').value;

            try {
                // বাটন ডিজেবল করা যাতে ডুপ্লিকেট ক্লিক না হয়
                loginBtn.disabled = true;
                loginBtn.innerText = 'Logging in...';

                // ব্যাকএন্ড API-তে লগইন রিকোয়েস্ট পাঠানো
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email_phone, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert(data.message || 'Login successful.');
                    
                    // সেশন ট্র্যাকিংয়ের জন্য লোকাল স্টোরেজে ডেটা সেট করা
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmailPhone', email_phone);
                    
                    // [সংশোধিত] ব্যাকএন্ড থেকে রোল (Role) চেক করে সঠিক ড্যাশবোর্ডে পাঠানো
                    if (data.role === 'admin') {
                        localStorage.setItem('userRole', 'admin');
                        window.location.href = 'admin.html'; 
                    } else {
                        localStorage.setItem('userRole', 'user');
                        window.location.href = 'dashboard.html'; 
                    }
                } else {
                    alert(data.message || 'Invalid email/phone or password');
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'Login';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না। আবার চেষ্টা করুন।');
                loginBtn.disabled = false;
                loginBtn.innerText = 'Login';
            }
        });
    </script>
</body>
</html>

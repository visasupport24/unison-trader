<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNISON TRADING - Home</title>
    <!-- সিএসএস ফাইল লিঙ্ক (সব ফাইল একই জায়গায় থাকবে) -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

        <!-- [সংশোধিত] রেসপনসিভ হেডার সেকশন (লোগো এবং মোবাইল মেনু ফিক্সড) -->
    <header class="main-header">
        <div class="header-container">
            <!-- লোগো আপডেট করা হলো -->
            <div class="logo">
                <a href="index.html" style="text-decoration:none; color:#f0b90b; font-weight:bold;">UNISON TRADING USA</a>
            </div>
            
            <!-- ডানপাশের অ্যাকশন এরিয়া -->
            <div class="header-actions">
                <div class="auth-buttons">
                    <a href="register.html" class="btn-signup">SIGN UP</a>
                    <a href="login.html" class="btn-login">LOGIN</a>
                </div>
                
                <!-- মোবাইলের জন্য ৩-লাইন হ্যামবার্গার মেনু বাটন -->
                <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
            </div>
        </div>

        <!-- নেভিগেশন মেনু (অন্যান্য ফাইলের সাথে নিখুঁত কানেকশন) -->
        <nav class="nav-links" id="navLinks">
            <a href="about.html">About</a>
            <a href="affiliate.html">Affiliate</a>
            <a href="withdraw.html">Withdraw</a>
        </nav>
    </header>

    <!-- ডাইনামিক ইমেজ স্লাইডার সেকশন -->
    <section class="slider-container">
        <div id="heroSliderContainer" style="max-width: 600px; margin: 20px auto; border-radius: 10px; overflow: hidden; border: 1px solid #2b2f36; background: #181a20; position: relative; min-height: 180px; display: flex; align-items: center; justify-content: center;">
            <!-- ডিফল্ট ওয়েলকাম টেক্সট (যদি অ্যাডমিন কোনো ছবি আপলোড না করে) -->
            <div id="defaultHeroBox" style="padding: 40px 20px; text-align: center;">
                <h2 style="color: #eaecef; margin: 0 0 10px 0; font-size: 22px;">WELCOME TO UNISON TRADING USA</h2>
                <p style="color: #848e9c; margin: 0; font-size: 14px;">Secure Crypto Investment Platform</p>
            </div>
            
            <!-- লাইভ স্লাইডার ইমেজ এখানে লোড হবে -->
            <img id="activeSliderImage" src="" alt="Banner" style="width: 100%; max-height: 260px; object-fit: cover; display: none; transition: opacity 0.5s ease-in-out;">
        </div>
    </section>

    

    <!-- লাইভ ট্রানজেকশন টেবিল সেকশন -->
    <section class="live-table-container">
        <h3>Live Transactions (Updates every 10 seconds)</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Amount</th>
                        <th>Type</th>
                        <th>TRC-20 Address</th>
                    </tr>
                </thead>
                <!-- জাভাস্ক্রিপ্ট এই টিবডির ভেতরে প্রতি ১০ সেকেন্ড পর পর নতুন ডেটা লোড করবে -->
                <tbody id="live-transaction-data">
                    <tr>
                        <td colspan="4" style="text-align: center;">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- অটোমেটিক ৬০টি ফেক ডেটা জেনারেট এবং চেঞ্জ করার জাভাস্ক্রিপ্ট -->
    <script>
        function generateLiveTransactions() {
            const tbody = document.getElementById('live-transaction-data');
            if(!tbody) return; // সেফটি চেক
            
            const types = ['Deposit', 'Withdraw'];
            let allRows = ''; // পারফরম্যান্স উন্নত করতে ভেরিয়েবল ব্যবহার

            // ৬০টি রো তৈরি করার লুপ
            for (let i = 0; i < 60; i++) {
                let randomUserId = 'usr_' + Math.floor(100000 + Math.random() * 900000);
                let randomAmount = (Math.random() * (5000 - 10) + 10).toFixed(2) + ' USDT';
                let randomType = types[Math.floor(Math.random() * types.length)];
                
                // নিরাপদ ও এলোমেলো TRC-20 অ্যাড্রেস জেনারেশন
                let randomAddress = 'T' + Math.random().toString(36).substring(2, 12).toUpperCase() + '...';

                // [সংশোধিত] টেবিলের কলাম সংখ্যা ৪টি করা হলো যাতে হেডার এর সাথে নিখুঁতভাবে মেলে
                allRows += `<tr>
                    <td>${randomUserId}</td>
                    <td class="${randomType === 'Deposit' ? 'amount-deposit' : 'amount-withdraw'}">${randomAmount}</td>
                    <td><span class="status-badge ${randomType.toLowerCase()}">${randomType}</span></td>
                    <td><code>${randomAddress}</code></td>
                </tr>`;
            }

            // লুপ শেষে একবারে ডমে (DOM) ডেটা পুশ করা হলো (ফাস্ট লোডিংয়ের জন্য)
            tbody.innerHTML = allRows; 
        }

        // পেজ লোড হওয়ামাত্রই প্রথমবার রান হবে
        document.addEventListener('DOMContentLoaded', generateLiveTransactions);

        // প্রতি ১০ সেকেন্ড (১০০০০ মিলিসেকেন্ড) পর পর ডেটা অটো পরিবর্তন হবে
        setInterval(generateLiveTransactions, 10000);

        // [নতুন যুক্ত করা হলো] মোবাইল মেনু অন/অফ করার জাভাস্ক্রিপ্ট লজিক
        function toggleMobileMenu() {
            const navLinks = document.getElementById('navLinks');
            if (navLinks) {
                navLinks.classList.toggle('show');
            }
        }
        // হোম পেজে অটোমেটিক ফটো স্লাইডার চালানোর লজিক
        async function initHomeSlider() {
            try {
                const res = await fetch('/api/sliders');
                const data = await res.json();

                if (data.success && data.sliders && data.sliders.length > 0) {
                    const sliders = data.sliders;
                    const defaultBox = document.getElementById('defaultHeroBox');
                    const sliderImg = document.getElementById('activeSliderImage');

                    if (defaultBox) defaultBox.style.display = 'none';
                    if (sliderImg) {
                        sliderImg.style.display = 'block';
                        let currentIndex = 0;
                        sliderImg.src = sliders[0].image_data;

                        // একাধিক ছবি থাকলে প্রতি ৩.৫ সেকেন্ড পর পর ছবি পরিবর্তন হবে
                        if (sliders.length > 1) {
                            setInterval(() => {
                                currentIndex = (currentIndex + 1) % sliders.length;
                                sliderImg.src = sliders[currentIndex].image_data;
                            }, 3500);
                        }
                    }
                }
            } catch (err) {
                console.error('Slider load error:', err);
            }
        }

        window.addEventListener('DOMContentLoaded', initHomeSlider);

        
    </script>
</body>
</html>

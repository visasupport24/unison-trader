<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- আইকন লাইব্রেরি -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <title>UNISON TRADING</title>
</head>
<body>
    <nav>
        <div class="logo"><i class="fa-solid fa-chart-line"></i> UNISON TRADING</div>
        <div>
            <a href="/login" class="btn btn-outline"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
            <a href="/register" class="btn"><i class="fa-solid fa-user-plus"></i> Registration</a>
        </div>
    </nav>
    <div class="notice-bar">
        <div class="notice-text"><i class="fa-solid fa-bullhorn"></i> Welcome to Unison Trading! Secure deposits and live fast withdrawals enabled via TRC-20 Network. Real-time system status: Optimal.</div>
    </div>
    <div class="container-fluid">
        <div class="card">
            <h2 style="color: var(--accent-gold); margin-bottom: 20px;"><i class="fa-solid fa-money-bill-transfer"></i> Today's Live Transactions</h2>
            <table>
                <thead>
                    <tr>
                        <th>User Id</th>
                        <th>Amount</th>
                        <th>DP/Withdraw</th>
                        <th>TRC-20 Address</th>
                    </tr>
                </thead>
                <tbody id="transaction-table">
                    <!-- ৩০টি লাইভ ডাটা স্ক্রিপ্ট থেকে এখানে আসবে -->
                </tbody>
            </table>
        </div>
    </div>
    <script>
        function loadLiveTransactions() {
            fetch('/api/live-transactions')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('transaction-table');
                    tbody.innerHTML = data.map(row => `
                        <tr>
                            <td><i class="fa-regular fa-user" style="color: #94a3b8; font-size: 13px;"></i> ${row.id}</td>
                            <td style="font-weight: bold; color: #fff;">${row.amount}</td>
                            <td style="color:${row.type === 'Deposit' ? 'var(--success-green)' : 'var(--danger-red)'}; font-weight: bold;">
                                <i class="${row.type === 'Deposit' ? 'fa-solid fa-arrow-down-long' : 'fa-solid fa-arrow-up-long'}"></i> ${row.type}
                            </td>
                            <td style="font-family: monospace; color: #cbd5e1; letter-spacing: 0.5px;">${row.address}</td>
                        </tr>
                    `).join('');
                });
        }
        loadLiveTransactions();
        setInterval(loadLiveTransactions, 4000); // প্রতি ৪ সেকেন্ড পর পর ডাটা পরিবর্তন হবে যা লাইভ দেখাবে
    </script>
</body>
</html>

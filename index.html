<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45Times - Login</title>
    <!-- গিটহাবের মেইন ডিরেক্টরিতে থাকা CSS ফাইলের লিংক -->
    <link rel="stylesheet" href="style.css">
    <!-- আইকনের জন্য FontAwesome CDN -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="auth-body">

    <div class="login-container">
        <!-- ভাষা পরিবর্তনের ড্রপডাউন -->
        <div class="lang-selector">
            <i class="fas fa-globe"></i> English <i class="fas fa-chevron-down"></i>
        </div>

        <!-- লোগো এবং ব্র্যান্ড নেম -->
        <div class="brand-section">
            <div class="logo-box">
                <span class="logo-text">45</span>
                <span class="logo-sub">TIMES</span>
            </div>
            <h1 class="brand-name">45Times</h1>
        </div>
        
        <!-- ইমেইল এবং ফোন লগইন ট্যাব -->
        <div class="tab-menu">
            <button class="tab-btn active" id="email-tab">Email Login</button>
            <button class="tab-btn" id="phone-tab">Phone Login</button>
        </div>

        <!-- লগইন ফর্ম -->
        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label id="inputLabel">E-mail</label>
                <input type="email" id="usernameInput" placeholder="E-mail" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="far fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <!-- বোতামসমূহ -->
            <button type="submit" class="btn-signin">Sign In</button>
            <!-- সাইন আপ বাটনে ক্লিক করলে আরেকটি পেজে যাওয়ার লজিক দিতে পারেন -->
            <button type="button" class="btn-signup" onclick="alert('রেজিস্ট্রেশন ফর্ম ফিচারটি ব্যাকএন্ডের সাথে যুক্ত করা হবে।')">Sign Up</button>
        </form>
    </div>

    <!-- ইন্টারঅ্যাক্টিভ ফাংশনালিটির জন্য জাভাস্ক্রিপ্ট -->
    <script>
        // পাসওয়ার্ড দেখা বা লুকানোর লজিক
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        // ইমেইল এবং ফোন ট্যাবের মধ্যে স্যুইচ করার লজিক
        const emailTab = document.getElementById('email-tab');
        const phoneTab = document.getElementById('phone-tab');
        const inputLabel = document.getElementById('inputLabel');
        const usernameInput = document.getElementById('usernameInput');

        emailTab.addEventListener('click', () => {
            emailTab.classList.add('active');
            phoneTab.classList.remove('active');
            inputLabel.innerText = 'E-mail';
            usernameInput.setAttribute('type', 'email');
            usernameInput.setAttribute('placeholder', 'E-mail');
        });

        phoneTab.addEventListener('click', () => {
            phoneTab.classList.add('active');
            emailTab.classList.remove('active');
            inputLabel.innerText = 'Phone Number';
            usernameInput.setAttribute('type', 'tel');
            usernameInput.setAttribute('placeholder', 'Phone Number');
        });

        // ডামি লগইন অ্যাকশন (আপাতত সরাসরি ড্যাশবোর্ডে নিয়ে যাবে)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>

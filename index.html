<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNISON TRADING - Home</title>
    <!-- সিএসএস ফাইল লিঙ্ক (সব ফাইল একই জায়গায় থাকবে) -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <!-- হেডার সেকশন (খাতার পাতা ১ অনুযায়ী) -->
    <header class="main-header">
        <div class="logo">UNISON TRADING</div>
        <div class="auth-buttons">
            <a href="/register" class="btn-signup">SIGN UP</a>
            <a href="/login" class="btn-login">LOGIN</a>
        </div>
    </header>

    <!-- স্লাইডার/ব্যানার সেকশন -->
    <section class="slider-container">
        <!-- অ্যাডমিন প্যানেল থেকে আপলোড করা ব্যানার ছবি এখানে শো করবে -->
        <div class="slider-placeholder">
            <h2>WELCOME TO UNISON TRADING</h2>
            <p>Secure Crypto Investment Platform</p>
        </div>
    </section>

    <!-- লাইভ ট্রানজেকশন টেবিল সেকশন -->
    <section class="live-table-container">
        <h3>Live Transactions (Updates every 10 seconds)</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Amount</th>
                        <th>DP/Withdraw</th>
                        <th>TRC-20 Address</th>
                    </tr>
                </thead>
                <!-- জাভাস্ক্রিপ্ট এই টিবডির ভেতরে প্রতি ১০ সেকেন্ড পর পর নতুন ডেটা লোড করবে -->
                <tbody id="live-transaction-data">
                    <tr>
                        <td colspan="4" style="text-align: center;">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- অটোমেটিক ৬০টি ফেক ডেটা জেনারেট এবং চেঞ্জ করার জাভাস্ক্রিপ্ট -->
    <script>
        function generateLiveTransactions() {
            const tbody = document.getElementById('live-transaction-data');
            tbody.innerHTML = ''; // আগের ডেটা মুছে ফেলা

            const types = ['Deposit', 'Withdraw'];
            
            // ছবিতে বলা শর্ত অনুযায়ী ন্যূনতম ৬০টি কলাম/রো (Rows) তৈরি করার লুপ
            for (let i = 0; i < 60; i++) {
                let randomUserId = 'usr_' + Math.floor(100000 + Math.random() * 900000);
                let randomAmount = (Math.random() * (5000 - 10) + 10).toFixed(2) + ' USDT';
                let randomType = types[Math.floor(Math.random() * types.length)];
                let randomAddress = 'T' + Math.random().toString(36).substring(2, 12).toUpperCase() + '...';

                // টেবিলের প্রতিটি রো তৈরি
                let row = `<tr>
                    <td>${randomUserId}</td>
                    <td class="${randomType === 'Deposit' ? 'amount-deposit' : 'amount-withdraw'}">${randomAmount}</td>
                    <td><span class="status-badge ${randomType.toLowerCase()}">${randomType}</span></td>
                    <td><code>${randomAddress}</code></td>
                </tr>`;
                
                tbody.innerHTML += row;
            }
        }

        // পেজ লোড হওয়ামাত্রই প্রথমবার রান হবে
        generateLiveTransactions();

        // ছবিতে দেওয়া শর্ত অনুযায়ী প্রতি ১০ সেকেন্ড (১০০০০ মিলিসেকেন্ড) পর পর ডেটা অটো পরিবর্তন হবে
        setInterval(generateLiveTransactions, 10000);
    </script>
</body>
</html>

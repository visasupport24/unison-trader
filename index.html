<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45Times - Login</title>
    <!-- গিটহাবের মেইন ডিরেক্টরিতে থাকা CSS ফাইলের লিংক -->
    <link rel="stylesheet" href="style.css">
    <!-- আইকনের জন্য FontAwesome CDN -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="auth-body">

    <div class="login-container">
        <!-- ভাষা পরিবর্তনের ড্রপডাউন -->
        <div class="lang-selector">
            <i class="fas fa-globe"></i> English <i class="fas fa-chevron-down"></i>
        </div>

        <!-- লোগো এবং ব্র্যান্ড নেম -->
        <div class="brand-section">
            <div class="logo-box">
                <span class="logo-text">45</span>
                <span class="logo-sub">TIMES</span>
            </div>
            <h1 class="brand-name">45Times</h1>
        </div>
        
        <!-- ইমেইল এবং ফোন লগইন ট্যাব -->
        <div class="tab-menu">
            <button class="tab-btn active" id="email-tab">Email Login</button>
            <button class="tab-btn" id="phone-tab">Phone Login</button>
        </div>

        <!-- লগইন ফর্ম -->
        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label id="inputLabel">E-mail</label>
                <input type="email" id="usernameInput" placeholder="E-mail" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="far fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <!-- বোতামসমূহ -->
            <button type="submit" class="btn-signin">Sign In</button>
            <!-- সাইন আপ বাটনে ক্লিক করলে আরেকটি পেজে যাওয়ার লজিক দিতে পারেন -->
            <button type="button" class="btn-signup" onclick="alert('রেজিস্ট্রেশন ফর্ম ফিচারটি ব্যাকএন্ডের সাথে যুক্ত করা হবে।')">Sign Up</button>
        </form>
    </div>
    <script>
        // পাসওয়ার্ড দেখা/লুকানোর লজিক
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        const usernameInput = document.getElementById('usernameInput');

        // লগইন (Sign In) সাবমিট লজিক
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = usernameInput.value;
            const password = passwordInput.value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    // ড্যাশবোর্ডে দেখানোর জন্য ইউজারের তথ্য ব্রাউজারের লোকাল স্টোরেজে সেভ রাখা
                    localStorage.setItem('userEmail', data.user.email);
                    localStorage.setItem('userBalance', data.user.balance);
                    localStorage.setItem('userVip', data.user.vip);
                    
                    alert(data.message);
                    window.location.href = 'dashboard.html'; // ড্যাশবোর্ডে রিডাইরেক্ট
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert("সার্ভারে যোগাযোগ করা যাচ্ছে না!");
            }
        });

        // সাইন আপ (Sign Up) বাটন লজিক
        async function handleSignUp() {
            const email = usernameInput.value;
            const password = passwordInput.value;

            if(!email || !password) {
                alert("অনুগ্রহ করে ইমেইল এবং পাসওয়ার্ড ফিল্ড পূরণ করুন!");
                return;
            }

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                alert("সাইন আপ করতে সমস্যা হয়েছে!");
            }
        }

        // সাইন আপ বাটনের সাথে ফাংশনটি যুক্ত করা
        document.querySelector('.btn-signup').setAttribute('onclick', 'handleSignUp()');
    </script>

    
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45Times - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .admin-section { background: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .admin-table th, .admin-table td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        .admin-table th { background-color: #f8fafc; color: #333; }
        .btn-approve { background-color: #0aa39c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-reject { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .status-Pending { background-color: #fef3c7; color: #d97706; }
        .status-Approved, .status-Success { background-color: #d1fae5; color: #065f46; }
        .status-Rejected { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="app-body" style="padding-bottom: 20px;">

    <header class="app-header">
        <div class="header-left">
            <span class="header-title"><i class="fas fa-user-shield"></i> Owner Admin Panel</span>
        </div>
    </header>

    <main style="padding: 16px;">
        <div class="admin-section">
            <h3 style="color: #2c3e50;"><i class="fas fa-wallet" style="color: #0aa39c;"></i> Pending Recharge Requests</h3>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>User Email</th>
                            <th>Amount</th>
                            <th>TxID</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="recharge-list"></tbody>
                </table>
            </div>
        </div>

        <div class="admin-section">
            <h3 style="color: #2c3e50;"><i class="fas fa-money-bill-wave" style="color: #e74c3c;"></i> Users Withdrawal Requests</h3>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>User Email</th>
                            <th>Amount</th>
                            <th>TRC20 Address</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="withdraw-list"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let currentDeposits = [];
        let currentWithdrawals = [];

        async function loadAdminData() {
            try {
                const response = await fetch('/api/admin/requests');
                const data = await response.json();

                if (data.success) {
                    currentDeposits = data.deposits;
                    currentWithdrawals = data.withdrawals;

                    // ১. রিচার্জ তালিকা জেনারেট
                    const rechargeBody = document.getElementById('recharge-list');
                    rechargeBody.innerHTML = currentDeposits.length === 0 ? '<tr><td colspan="5" style="text-align:center;">কোনো পেন্ডিং রিকোয়েস্ট নেই</td></tr>' : '';
                    
                    currentDeposits.forEach((dep, index) => {
                        const tr = document.createElement('tr');
                        
                        let actionButtons = 'Done';
                        if (dep.status === 'Pending') {
                            actionButtons = "<button class='btn-approve' onclick='actionRecharge(" + index + ", \"approve\")'>Approve</button>" +
                                            "<button class='btn-reject' onclick='actionRecharge(" + index + ", \"reject\")'>Reject</button>";
                        }

                        tr.innerHTML = "<td>" + dep.email + "</td>" +
                                       "<td><b>$" + dep.amount + "</b></td>" +
                                       "<td style='word-break:break-all;'>" + dep.txid + "</td>" +
                                       "<td><span class='status-badge status-" + dep.status + "'>" + dep.status + "</span></td>" +
                                       "<td>" + actionButtons + "</td>";
                        
                        rechargeBody.appendChild(tr);
                    });

                    // ২. উইথড্র তালিকা জেনারেট
                    const withdrawBody = document.getElementById('withdraw-list');
                    withdrawBody.innerHTML = currentWithdrawals.length === 0 ? '<tr><td colspan="5" style="text-align:center;">কোনো উইথড্র রিকোয়েস্ট নেই</td></tr>' : '';
                    
                    currentWithdrawals.forEach((wit, index) => {
                        const tr = document.createElement('tr');
                        
                        let actionButtons = 'Done';
                        if (wit.status === 'Pending') {
                            actionButtons = "<button class='btn-approve' onclick='actionWithdraw(" + index + ", \"Success\")'>Success</button>" +
                                            "<button class='btn-reject' onclick='actionWithdraw(" + index + ", \"Rejected\")'>Reject</button>";
                        }

                        tr.innerHTML = "<td>" + wit.email + "</td>" +
                                       "<td><b style='color:#e74c3c;'>$" + wit.amount + "</b></td>" +
                                       "<td style='word-break:break-all; font-family:monospace;'>" + wit.address + "</td>" +
                                       "<td><span class='status-badge status-" + wit.status + "'>" + wit.status + "</span></td>" +
                                       "<td>" + actionButtons + "</td>";
                        
                        withdrawBody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("ডেটা লোড করতে সমস্যা হয়েছে");
            }
        }

        // রিচার্জ অ্যাকশন প্রসেসর (Approve / Reject)
        async function actionRecharge(index, type) {
            const dep = currentDeposits[index];
            const url = type === 'approve' ? '/api/admin/recharge/approve' : '/api/admin/recharge/reject';
            const confirmMsg = type === 'approve' ? 
                "ইউজার " + dep.email + "-এর অ্যাকাউন্টে $" + dep.amount + " যুক্ত করতে আপনি কি নিশ্চিত?" : 
                "ইউজার " + dep.email + "-এর $" + dep.amount + " রিচার্জ রিকোয়েস্টটি আপনি কি বাতিল করতে নিশ্চিত?";

            if (!confirm(confirmMsg)) return;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: dep.id, email: dep.email, amount: dep.amount })
                });
                const data = await response.json();
                alert(data.message);
                loadAdminData();
            } catch (error) {
                alert("রিকোয়েস্ট প্রসেস করতে ত্রুটি হয়েছে!");
            }
        }

        // উইথড্র অ্যাকশন প্রসেসর (Success / Reject)
        async function actionWithdraw(index, actionType) {
            const wit = currentWithdrawals[index];
            const confirmMsg = actionType === 'Success' ? "উইথড্র রিকোয়েস্টটি সফল করতে চান?" : "উইথড্রটি রিজেক্ট করে টাকা ফেরত দিতে চান?";
            
            if (!confirm(confirmMsg)) return;

            try {
                const response = await fetch('/api/admin/withdraw/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: wit.id, action: actionType, email: wit.email, amount: wit.amount })
                });
                const data = await response.json();
                alert(data.message);
                loadAdminData();
            } catch (error) {
                alert("উইথড্র প্রসেস করতে ত্রুটি হয়েছে!");
            }
        }

        loadAdminData();
    </script>
</body>
</html>

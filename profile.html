<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Unison Trading</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <script>if (!localStorage.getItem('token')) { window.location.href = 'login.html'; }</script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col pb-24">
    <header class="w-full max-w-md mx-auto p-4 flex items-center border-b border-gray-800">
        <a href="dashboard.html" class="text-gray-400 mr-3"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="text-sm font-bold text-yellow-500 uppercase">Profile Settings</h2>
    </header>
    <main class="w-full max-w-md mx-auto p-4 space-y-4 text-xs">
        <div class="flex gap-3">
            <button onclick="alert('Deposit Working')" class="w-1/2 bg-green-500 text-gray-900 font-bold py-2 rounded-xl">Deposit</button>
            <button onclick="alert('Withdraw Working')" class="w-1/2 bg-red-500 text-white font-bold py-2 rounded-xl">Withdraw</button>
        </div>
        <div class="bg-gray-800 border border-gray-700 rounded-xl divide-y divide-gray-700">
            <div class="p-3.5 flex justify-between"><span>Transaction History</span><i class="fa-solid fa-chevron-right"></i></div>
            <div class="p-3.5 flex justify-between"><span>KYC Verification</span><span class="text-yellow-500 font-bold">Pending</span></div>
        </div>
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 text-center">
            <button onclick="alert('Support')" class="w-full bg-yellow-500/10 border border-yellow-500/30 text-yellow-500 font-bold py-2.5 rounded-lg">* Live Chat</button>
        </div>
    </main>
    <nav class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 py-2.5 px-4 z-50">
        <div class="w-full max-w-md mx-auto flex justify-between text-center text-gray-400">
            <a href="index.html" class="w-1/4"><i class="fa-solid fa-house text-lg"></i></a>
            <a href="dashboard.html" class="w-1/4"><i class="fa-solid fa-chart-pie text-lg"></i></a>
            <a href="affiliate.html" class="w-1/4"><i class="fa-solid fa-users text-lg"></i></a>
            <a href="about.html" class="w-1/4 text-yellow-500"><i class="fa-solid fa-circle-info text-lg"></i></a>
        </div>
    </nav>
</body>
</html>

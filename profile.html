<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Unison Trading</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="styles.css">
    <script>if (!localStorage.getItem('token')) { window.location.href = 'login.html'; }</script>
</head>
<body class="pb-5">
    <header class="w-100 max-w-md mx-auto p-3 d-flex align-items-center border-bottom border-secondary">
        <a href="dashboard.html" class="text-secondary me-3"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="h6 font-weight-bold text-yellow uppercase m-0">Profile Settings</h2>
    </header>
    <main class="w-100 max-w-md mx-auto p-3 vstack gap-3 small">
        <div class="row g-2">
            <div class="col-6"><button onclick="alert('Deposit Form Coming')" class="btn btn-success w-100 py-2 fw-bold">Deposit</button></div>
            <div class="col-6"><button onclick="alert('Withdraw Form Coming')" class="btn btn-danger w-100 py-2 fw-bold">Withdraw</button></div>
        </div>
        <div class="card-custom text-light shadow-sm">
            <div class="p-3 d-flex justify-content-between align-items-center border-bottom border-secondary"><span>Transaction History</span><i class="fa-solid fa-chevron-right text-secondary"></i></div>
            <div class="p-3 d-flex justify-content-between align-items-center border-bottom border-secondary"><span>KYC Verification</span><span class="badge bg-warning text-dark font-weight-bold">PENDING</span></div>
            <div class="p-3 d-flex justify-content-between align-items-center" onclick="logout()" style="cursor:pointer;"><span class="text-danger fw-bold">Sign Out</span><i class="fa-solid fa-right-from-bracket text-danger"></i></div>
        </div>
        <div class="card-custom p-3 shadow-sm text-center">
            <button onclick="alert('Live support starting...')" class="btn btn-outline-warning w-100 py-2.5 fw-bold">* Live Chat</button>
        </div>
    </main>
    <nav class="fixed-bottom nav-bottom py-2 shadow-lg">
        <div class="w-100 max-w-md mx-auto d-flex justify-around text-center text-secondary small">
            <a href="index.html" class="text-secondary text-decoration-none"><i class="fa-solid fa-house h5 d-block m-0"></i>Home</a>
            <a href="dashboard.html" class="text-secondary text-decoration-none"><i class="fa-solid fa-chart-pie h5 d-block m-0"></i>Dashboard</a>
            <a href="affiliate.html" class="text-secondary text-decoration-none"><i class="fa-solid fa-users h5 d-block m-0"></i>Affiliate</a>
            <a href="about.html" class="text-secondary text-decoration-none"><i class="fa-solid fa-circle-info h5 d-block m-0"></i>About</a>
        </div>
    </nav>
    <script>function logout() { localStorage.clear(); window.location.href = 'login.html'; }</script>
</body>
</html>

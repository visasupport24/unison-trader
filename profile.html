<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <title>Profile Settings</title>
</head>
<body>
    <div class="container" style="max-width: 600px; margin-top: 50px;">
        <div class="card">
            <h2 style="color: var(--accent-gold); border-bottom: 1px solid #334155; padding-bottom: 10px;">
                <i class="fa-solid fa-user-shield"></i> Secure User Profile
            </h2>
            <div style="margin: 25px 0;">
                <button class="btn" style="margin-right:15px;"><i class="fa-solid fa-wallet"></i> Deposit</button>
                <button class="btn btn-outline"><i class="fa-solid fa-money-bill-transfer"></i> Withdraw</button>
            </div>
            <ul class="profile-menu">
                <li><i class="fa-solid fa-clock-rotate-left menu-icon"></i> Transaction History <i class="fa-solid fa-chevron-right arrow-right"></i></li>
                <li style="display: flex; justify-content: space-between; align-items: center;">
                    <span><i class="fa-solid fa-sliders menu-icon"></i> Permission Bar</span>
                    <div>
                        <button class="btn" style="padding:4px 12px; font-size:12px;">ON</button>
                        <button class="btn btn-outline" style="padding:4px 12px; font-size:12px; border-color:var(--danger-red); color:var(--danger-red);">OFF</button>
                    </div>
                </li>
                <li><i class="fa-solid fa-id-card menu-icon"></i> KYC Verification <span style="float:right; color:var(--danger-red); font-size:12px; font-weight:bold;">Unverified</span></li>
                <li><i class="fa-solid fa-key menu-icon"></i> Password Change <i class="fa-solid fa-chevron-right arrow-right"></i></li>
                <li><i class="fa-solid fa-headset menu-icon"></i> Contact Support: 
                    <a href="#" style="color:var(--accent-gold); margin-left:10px; text-decoration:none;"><i class="fa-brands fa-telegram"></i> TG Channel</a> | 
                    <a href="#" style="color:var(--accent-gold); text-decoration:none;"><i class="fa-brands fa-telegram"></i> TG Group</a>
                </li>
                <li><i class="fa-solid fa-comments menu-icon"></i> Live Chat Support <i class="fa-solid fa-chevron-right arrow-right"></i></li>
                <li style="border-bottom: none; text-align: center; margin-top: 20px;">
                    <a href="/" class="btn" style="background:var(--danger-red); color:#fff; display:block; text-align:center;"><i class="fa-solid fa-right-from-bracket"></i> Sign Out Account</a>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>

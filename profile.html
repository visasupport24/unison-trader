<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNISON TRADING - Profile</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-container { padding: 20px 5%; margin-bottom: 80px; max-width: 600px; margin-left: auto; margin-right: auto; }
        
        /* ব্যালেন্স বক্স স্টাইল */
        .profile-balance-box { background: linear-gradient(135deg, #181a20 0%, #1e2329 100%); border: 1px solid #2b2f36; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .profile-balance-box h3 { color: #848e9c; font-size: 14px; margin-bottom: 8px; text-transform: uppercase; }
        .profile-balance-box p { font-size: 28px; font-weight: bold; color: #f0b90b; }
        
        /* মেনু লিস্ট স্টাইল */
        .profile-menu { background: #181a20; border: 1px solid #2b2f36; border-radius: 8px; overflow: hidden; margin-bottom: 30px; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; color: #eaecef; text-decoration: none; border-bottom: 1px solid #2b2f36; font-size: 15px; font-weight: 500; transition: background 0.2s; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background: #2b2f36; }
        .menu-item .icon-text { display: flex; align-items: center; gap: 12px; }
        .menu-item .arrow { color: #848e9c; font-weight: bold; }
        .menu-item.logout { color: #f6465d; }
        
        /* সোশ্যাল কন্টাক্ট ব্যাজ গ্রুপিং */
        .contact-group { display: flex; gap: 8px; font-size: 12px; }
        .contact-badge { background: #2b2f36; color: #b7bdc6; padding: 4px 8px; border-radius: 4px; text-decoration: none; transition: 0.2s; }
        .contact-badge:hover { background: #f0b90b; color: #000; }

        /* ট্রেডিং পার্টনার সেকশন */
        .partners-section { text-align: center; margin-top: 20px; padding: 15px; background: #181a20; border-radius: 8px; border: 1px solid #2b2f36; }
        .partners-section h4 { color: #848e9c; font-size: 12px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .partner-logos { display: flex; justify-content: center; gap: 20px; align-items: center; color: #848e9c; font-weight: bold; font-size: 14px; opacity: 0.7; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #181a20; border-top: 1px solid #2b2f36; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .bottom-nav a { color: #848e9c; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; }
        .bottom-nav a.active { color: #f0b90b; }
    </style>
</head>
<body>

    <!-- হেডার সেকশন -->
    <header class="main-header">
        <div class="logo">UNISON TRADING</div>
        <div id="userEmailDisplay" style="font-size: 14px; color: #848e9c;">Loading...</div>
    </header>

    <div class="profile-container">
        <!-- বর্তমান ব্যালেন্স ডিসপ্লে -->
        <div class="profile-balance-box">
            <h3>Total Balance</h3>
            <p><span id="profileBalance">0.00</span> USDT</p>
        </div>

        <!-- প্রোফাইল মেনু তালিকা (নাম্বারিং প্রফেশনাল ও একরূপ করা হয়েছে) -->
        <div class="profile-menu">
            <a href="add_fund.html" class="menu-item">
                <div class="icon-text"><span>💰</span> Add Fund</div>
                <span class="arrow">→</span>
            </a>
            <a href="withdraw.html" class="menu-item">
                <div class="icon-text"><span>💸</span> Withdraw</div>
                <span class="arrow">→</span>
            </a>

            <a href="kyc.html" class="menu-item">

                <div class="icon-text"><span>🆔</span> KYC Verification</div>
                <span class="arrow">→</span>
            </a>
            <a href="affiliate.html" class="menu-item">
                <div class="icon-text"><span>🔗</span> Affiliate Program</div>
                <span class="arrow">→</span>
            </a>
            <a href="password_change.html" class="menu-item">

                <div class="icon-text"><span>🔒</span> Password Change</div>
                <span class="arrow">→</span>
            </a>
            
                    <!-- [সংশোধিত] সাপোর্ট অপশন আইডি লিঙ্ক সহ করা হলো -->
        <div class="menu-item" style="cursor: default;">
            <div class="icon-text"><span>📞</span><span>Contact Support</span></div>
            <div class="contact-group">
                <a id="telegramBtn" href="https://t.me" target="_blank" class="contact-badge">Telegram</a>
                <a id="emailBtn" href="mailto:support@unisontrading.com" class="contact-badge">Email</a>
            </div>
        </div>

            
            
            <a href="#" class="menu-item logout" id="logoutBtn">
                <div class="icon-text"><span>🚪</span> Sign-Out</div>
                <span class="arrow">→</span>
            </a>
        </div>

        <!-- ট্রেডিং পার্টনারদের লোগো সেকশন -->
        <div class="partners-section">
            <h4>Trading Partners</h4>
            <div class="partner-logos">
                <span>Binance</span> • <span>KuCoin</span> • <span>OKX</span> • <span>Bybit</span>
            </div>
        </div>
    </div>

    <!-- বটম নেভিগেশন বার -->
    <nav class="bottom-nav">
        <a href="dashboard.html"><span>🏠</span>Home</a>
        <a href="about.html"><span>ℹ️</span>About us</a>
        <a href="profile.html" class="active"><span>👤</span>Profile</a>
    </nav>

    <script>
        // সিকিউরিটি চেক: লগইন না থাকলে login.html ফাইলে রিডাইরেক্ট
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        // অ্যাডমিন ইউজার ঢুকলে তাকে অ্যাডমিন পেজে পাঠিয়ে দেওয়া
        if (localStorage.getItem('userRole') === 'admin') {
            window.location.href = 'admin.html';
        }

        const email_phone = localStorage.getItem('userEmailPhone');
        if (email_phone) {
            document.getElementById('userEmailDisplay').innerText = email_phone;
        }

        // লাইভ ব্যালেন্স লোড করা
        async function fetchProfileBalance() {
            if (!email_phone) return;
            try {
                const response = await fetch(`/api/user/dashboard?email_phone=${encodeURIComponent(email_phone)}`);
                const data = await response.json();
                
                if (data.success && data.user) {
                    const userData = Array.isArray(data.user) ? data.user[0] : data.user;
                    
                    if (userData) {
                        document.getElementById('profileBalance').innerText = parseFloat(userData.balance || 0).toFixed(2);
                    }
                }
            } catch (error) {
                console.error('ব্যালেন্স লোড ব্যর্থ:', error);
            }
        }

        // পেজ লোড সম্পূর্ণ হলে ফাংশনটি রান হবে
        document.addEventListener('DOMContentLoaded', fetchProfileBalance);

        // সাইন-আউট (Logout) হ্যান্ডেলার
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('আপনি কি নিশ্চিতভাবে সাইন-আউট করতে চান?')) {
                localStorage.clear(); // সব লোকাল সেশন মুছে ফেলা
                window.location.href = 'login.html';
            }
        });

             // ডাটাবেজ থেকে লাইভ সাপোর্ট সেটিংস লোড করার ফাংশন
        async function loadSupportSettings() {
            try {
                const response = await fetch('/api/site/settings');
                const data = await response.json();
                
                if (data.success && data.settings) {
                    // ডাটাবেজের লাইভ লিংক বাটনগুলোতে সেট করা হলো
                    document.getElementById('telegramBtn').href = data.settings.telegram_link || '#';
                    document.getElementById('emailBtn').href = `mailto:${data.settings.support_email || ''}`;
                }
            } catch (err) {
                console.error("সাপোর্ট সেটিংস লোড করতে সমস্যা:", err);
            }
        }

        // পেজ লোড হওয়ার সাথে সাথে সাপোর্ট সেটিংস রান হবে
        window.addEventListener('DOMContentLoaded', loadSupportSettings);
   
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNISON TRADING - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ড্যাশবোর্ডের জন্য বিশেষ ইন্টারনাল সিএসএস */
        .dashboard-container { padding: 20px 5%; margin-bottom: 80px; }
        .notice-board { background: #181a20; border: 1px solid #f0b90b; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #f0b90b; font-size: 14px; }
        .action-cards { display: flex; gap: 15px; margin-bottom: 25px; }
        .btn-action { flex: 1; padding: 12px; text-align: center; text-decoration: none; font-weight: bold; border-radius: 6px; font-size: 16px; }
        .btn-deposit { background-color: #0ecb81; color: #000; }
        .btn-withdraw-action { background-color: #f6465d; color: #fff; }
        
        /* [সংশোধিত] গ্রিড কন্টেইনার মোবাইল ও ডেস্কটপ ফ্রেন্ডলি করা হলো */
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
        @media (max-width: 480px) {
            .grid-container { grid-template-columns: 1fr; } /* ছোট মোবাইলে ১ কলাম হবে */
        }
        
        .balance-card { background: #181a20; border: 1px solid #2b2f36; padding: 20px; border-radius: 8px; text-align: center; }
        .balance-card h4 { color: #848e9c; font-size: 13px; margin-bottom: 5px; text-transform: uppercase; }
        .balance-card p { font-size: 20px; font-weight: bold; color: #eaecef; }
        .balance-card .highlight { color: #f0b90b; }

        /* [সংশোধিত] হেডার এর ইউজার ইনফো ও লগআউট বাটন ডিজাইন */
        .user-meta { display: flex; align-items: center; gap: 10px; }
        .btn-logout { background: transparent; border: 1px solid #f6465d; color: #f6465d; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.3s; }
        .btn-logout:hover { background: #f6465d; color: #fff; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #181a20; border-top: 1px solid #2b2f36; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .bottom-nav a { color: #848e9c; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; }
        .bottom-nav a.active { color: #f0b90b; }
    </style>
</head>
<body>


         <!-- [সংশোধিত] ড্যাশবোর্ডের প্রফেশনাল রেসপনসিভ টপ হেডার (ফাংশন ও আইকন ফিক্সড) -->
        <header class="dashboard-header">
            <div class="db-header-container">
                <!-- বাম পাশে লোগো ও মোবাইল নম্বর কন্টেইনার -->
                <div class="user-info-area">
                    <h2 class="db-logo">UNISON TRADING USA</h2>
                    <span id="userMobileDisplay" class="user-number">01555555555</span>
                </div>
                
                <!-- ডান পাশে প্রফেশনাল লগআউট বাটন (ফাংশন নাম পরিবর্তন ও ভাঙা বক্স দূর করা হলো) -->
                
<button class="btn-db-logout" onclick="localStorage.clear(); window.location.href='login.html';">
    <span>Logout</span>
</button>
 </div>
</header>


    <div class="dashboard-container">
        <!-- নোটিশ বোর্ড -->
                    <div class="notice-board">
                <strong>Notice Board:</strong> <span id="liveNoticeText">Loading notice...</span>
            </div>


        <!-- অ্যাকশন বাটনসমূহ -->
        <div class="action-cards">
            <a href="add_fund.html" class="btn-action btn-deposit">Add fund</a>
            <a href="withdraw.html" class="btn-action btn-withdraw-action">Withdraw</a>
        </div>

        <!-- ৪টি মূল ব্যালেন্স গ্রিড কার্ড -->
        <div class="grid-container">
            <div class="balance-card">
                <h4>Balance</h4>
                <p class="highlight"><span id="mainBalance">0.00</span> USDT</p>
            </div>
            <div class="balance-card">
                <h4>Todays Profit</h4>
                <p style="color: #0ecb81;">+<span id="todaysProfit">0.00</span> USDT</p>
            </div>
            <div class="balance-card">
                <h4>Team Member</h4>
                <p><span id="teamMember">0</span> Person</p>
            </div>
            <div class="balance-card">
                <h4>Todays Commission</h4>
                <p style="color: #f0b90b;">+<span id="todaysCommission">0.00</span> USDT</p>
            </div>
        </div>
    </div>

    <!-- বটম নেভিগেশন বার -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="active"><span>🏠</span>Home</a>
        <a href="about.html"><span>ℹ️</span>About us</a>
        <a href="profile.html"><span>👤</span>Profile</a>
    </nav>

    <!-- ফ্রন্টএন্ড ডেটা হ্যান্ডেল ও সেশন সিকিউরিটি স্ক্রিপ্ট -->
        <script>
        // ১. সেশন সিকিউরিটি চেক: লগইন না থাকলে সরাসরি login.html ফাইলে ফেরত পাঠাবে
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
        if (localStorage.getItem('userRole') === 'admin') {
            window.location.href = 'admin.html';
        }

        const email_phone = localStorage.getItem('userEmailPhone');

        // ২. ইউজারের মোবাইল নম্বর, ব্যালেন্স, প্রফিট এবং টিম মেম্বার লোড করার ফাংশন
        async function loadDashboardData() {
            if (!email_phone) {
                window.location.href = 'login.html';
                return;
            }

            // টপ হেডারে লগইন করা ইউজারের আসল নম্বর বসানো
            const mobileDisplay = document.getElementById('userMobileDisplay');
            if (mobileDisplay) {
                mobileDisplay.innerText = email_phone;
            }

            try {
                const response = await fetch(`/api/user/dashboard?email_phone=${encodeURIComponent(email_phone)}`);
                const data = await response.json();

                if (data.success && data.user) {
                    const user = data.user;
                    
                    // ব্যালেন্স আপডেট (আপনার HTML-এ যে আইডি আছে তা অটোমেটিক খুঁজে নেবে)
                    const balanceEl = document.getElementById('userBalance') || document.getElementById('balanceDisplay') || document.querySelector('.highlight span');
                    if (balanceEl) {
                        balanceEl.innerText = parseFloat(user.balance || 0).toFixed(2);
                    }

                    // আজকের প্রফিট আপডেট
                    const profitEl = document.getElementById('todaysProfit') || document.getElementById('profitDisplay');
                    if (profitEl) {
                        profitEl.innerText = parseFloat(user.todays_profit || 0).toFixed(2);
                    }

                    // টিম মেম্বার আপডেট
                    const teamEl = document.getElementById('teamMember') || document.getElementById('teamDisplay');
                    if (teamEl) {
                        teamEl.innerText = user.team_member || 0;
                    }
                }
            } catch (error) {
                console.error('ড্যাশবোর্ড ডেটা লোড করতে ত্রুটি:', error);
            }
        }

        // ৩. ডাটাবেজ থেকে লাইভ নোটিশ লোড করার ফাংশন
        async function loadLiveNotice() {
            try {
                const response = await fetch('/api/site/settings');
                const data = await response.json();
                
                if (data.success && data.settings) {
                    const settings = Array.isArray(data.settings) ? data.settings[0] : data.settings;
                    const noticeEl = document.getElementById('liveNoticeText');
                    if (noticeEl && settings) {
                        noticeEl.innerText = settings.notice || 'Welcome to UNISON TRADING USA!';
                    }
                }
            } catch (err) {
                console.error("নোটিশ লোড করতে সমস্যা:", err);
            }
        }

        // ৪. পেজ লোড হওয়ার সাথে সাথেই দুটি ফাংশন রান হবে
        window.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
            loadLiveNotice();
        });
    </script>
</body>
</html>

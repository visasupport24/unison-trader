<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNISON TRADING - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ড্যাশবোর্ডের জন্য বিশেষ ইন্টারনাল সিএসএস */
        .dashboard-container { padding: 20px 5%; margin-bottom: 80px; }
        .notice-board { background: #181a20; border: 1px solid #f0b90b; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #f0b90b; font-size: 14px; }
        .action-cards { display: flex; gap: 15px; margin-bottom: 25px; }
        .btn-action { flex: 1; padding: 12px; text-align: center; text-decoration: none; font-weight: bold; border-radius: 6px; font-size: 16px; }
        .btn-deposit { background-color: #0ecb81; color: #000; }
        .btn-withdraw-action { background-color: #f6465d; color: #fff; }
        
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
        .balance-card { background: #181a20; border: 1px solid #2b2f36; padding: 20px; border-radius: 8px; text-align: center; }
        .balance-card h4 { color: #848e9c; font-size: 13px; margin-bottom: 5px; text-transform: uppercase; }
        .balance-card p { font-size: 20px; font-weight: bold; color: #eaecef; }
        .balance-card .highlight { color: #f0b90b; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #181a20; border-top: 1px solid #2b2f36; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .bottom-nav a { color: #848e9c; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; }
        .bottom-nav a.active { color: #f0b90b; }
    </style>
</head>
<body>

    <!-- হেডার সেকশন -->
    <header class="main-header">
        <div class="logo">UNISON TRADING</div>
        <div class="user-info" id="userDisplay" style="font-size: 14px; color: #848e9c;">Loading...</div>
    </header>

    <div class="dashboard-container">
        <!-- নোটিশ বোর্ড (ছবি ৩ অনুযায়ী) -->
        <div class="notice-board">
            <strong>Notice Board:</strong> <span id="noticeText">Welcome! Daily profit 1%-3% automatically credited. Invite friends for 20% team commission!</span>
        </div>

        <!-- অ্যাকশন বাটনসমূহ (ছবি ৩ অনুযায়ী) -->
        <div class="action-cards">
            <a href="/add_fund" class="btn-action btn-deposit">Add fund</a>
            <a href="/withdraw" class="btn-action btn-withdraw-action">Withdraw</a>
        </div>

        <!-- ৪টি মূল ব্যালেন্স গ্রিড কার্ড (ছবি ৩ অনুযায়ী) -->
        <div class="grid-container">
            <div class="balance-card">
                <h4>Balance</h4>
                <p class="highlight"><span id="mainBalance">0.00</span> USDT</p>
            </div>
            <div class="balance-card">
                <h4>Todays Profit</h4>
                <p style="color: #0ecb81;">+<span id="todaysProfit">0.00</span> USDT</p>
            </div>
            <div class="balance-card">
                <h4>Team Member</h4>
                <p><span id="teamMember">0</span> Person</p>
            </div>
            <div class="balance-card">
                <h4>Todays Commission</h4>
                <p style="color: #f0b90b;">+<span id="todaysCommission">0.00</span> USDT</p>
            </div>
        </div>
    </div>

    <!-- বটম নেভিগেশন বার (ছবি ৩ অনুযায়ী) -->
    <nav class="bottom-nav">
        <a href="/dashboard" class="active"><span>🏠</span>Home</a>
        <a href="/about"><span>ℹ️</span>About us</a>
        <a href="/profile"><span>👤</span>Profile</a>
    </nav>

    <!-- ফ্রন্টএন্ড ডেটা হ্যান্ডেল ও সেশন সিকিউরিটি স্ক্রিপ্ট -->
    <script>
        // সিকিউরিটি চেক: লগইন না থাকলে ফেরত পাঠাবে
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = '/login';
        }

        // লোকাল স্টোরেজ থেকে ইউজারের আইডেন্টিটি দেখানো
        const userEmailPhone = localStorage.getItem('userEmailPhone');
        if (userEmailPhone) {
            document.getElementById('userDisplay').innerText = userEmailPhone;
        }

        // ব্যাকএন্ড থেকে ইউজারের লাইভ ব্যালেন্স ও প্রফিট ডেটা লোড করার ফাংশন
        async function fetchDashboardData() {
            try {
                const response = await fetch(`/api/user/dashboard?email_phone=${encodeURIComponent(userEmailPhone)}`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('mainBalance').innerText = parseFloat(data.user.balance).toFixed(2);
                    document.getElementById('todaysProfit').innerText = parseFloat(data.user.todays_profit).toFixed(2);
                    document.getElementById('teamMember').innerText = data.user.team_member;
                    document.getElementById('todaysCommission').innerText = parseFloat(data.user.todays_commission).toFixed(2);
                }
            } catch (error) {
                console.error('ডেটা লোড করতে ব্যর্থ:', error);
            }
        }

        // পেজ লোড হলে রান হবে
        fetchDashboardData();
    </script>
</body>
</html>

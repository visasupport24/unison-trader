<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45Times - Withdraw</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="app-body">

    <!-- টপ হেডার বার -->
    <header class="app-header">
        <div class="header-left">
            <a href="dashboard.html" style="color: white; text-decoration: none;"><i class="fas fa-chevron-left"></i> Back</a>
            <span class="header-title" style="margin-left: 15px;">Withdraw USDT</span>
        </div>
    </header>

    <main style="padding: 16px;">
        <!-- বর্তমান ব্যালেন্স প্রদর্শন কার্ড -->
        <div style="background: linear-gradient(135deg, #2c3e50, #34495e); color: white; padding: 20px; border-radius: 16px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 16px;">
            <p style="font-size: 13px; opacity: 0.8;">Available Balance</p>
            <h2 style="font-size: 32px; font-weight: 700; margin-top: 5px;"><span id="display-balance">0.00</span> USDT</h2>
        </div>

        <!-- উইথড্র ফর্ম -->
        <div style="background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.02);">
            <h3 style="font-size: 16px; margin-bottom: 15px; color: #2c3e50;">Withdrawal Details</h3>
            
            <form id="withdrawForm">
                <div class="input-group">
                    <label>Network Type</label>
                    <input type="text" value="USDT (TRC20)" disabled style="background-color: #e2e8f0; color: #475569;">
                </div>

                <div class="input-group">
                    <label>Your USDT (TRC20) Address</label>
                    <input type="text" id="walletAddress" placeholder="Enter your TRC20 wallet address" required>
                </div>

                <div class="input-group">
                    <label>Withdraw Amount (USDT)</label>
                    <input type="number" id="withdrawAmount" placeholder="Min $5" min="5" step="0.01" required>
                </div>

                <button type="submit" class="btn-signin" style="margin-top: 10px; background-color: #e74c3c;">Submit Withdrawal</button>
            </form>
        </div>
    </main>

    <script>
        // সেশন ও ব্যালেন্স চেক
        const userEmail = localStorage.getItem('userEmail');
        let userBalance = localStorage.getItem('userBalance') || 0;

        if (!userEmail) window.location.href = 'index.html';

        // স্ক্রিনে বর্তমান লাইভ ব্যালেন্স দেখানো
        document.getElementById('display-balance').innerText = parseFloat(userBalance).toFixed(2);

        // উইথড্র ফর্ম সাবমিট লজিক
        document.getElementById('withdrawForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const address = document.getElementById('walletAddress').value;
            const amount = parseFloat(document.getElementById('withdrawAmount').value);

            // পর্যাপ্ত ব্যালেন্স আছে কিনা ফ্রন্টএন্ড ভ্যালিডেশন
            if (amount > parseFloat(userBalance)) {
                alert("আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
                return;
            }

            try {
                const response = await fetch('/api/withdraw/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, amount, address })
                });
                const data = await response.json();
                
                if(data.success) {
                    // লোকal স্টোরেজে ব্যালেন্স আপডেট করা
                    localStorage.setItem('userBalance', data.newBalance);
                    alert(data.message);
                    window.location.href = 'profile.html';
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert("সার্ভারে রিকোয়েস্ট পাঠাতে সমস্যা হয়েছে!");
            }
        });
    </script>
</body>
</html>

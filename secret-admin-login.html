<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNISON TRADING - Admin Gateway</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="auth-header" style="padding: 20px; text-align: center;">
        <div class="logo" style="color: #f0b90b; font-size: 26px; font-weight: bold;">UNISON TRADING CONTROL</div>
    </header>

    <div class="auth-container" style="border-color: #f0b90b;">
        <h2 style="color: #f0b90b;">Admin Secure Login</h2>
        <form id="adminLoginForm">
            <div class="input-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" placeholder="Enter admin username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" placeholder="Enter admin password" required>
            </div>

            <button type="submit" id="loginBtn" class="auth-btn" style="background-color: #f0b90b; color: #000;">Authorize</button>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginBtn = document.getElementById('loginBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                loginBtn.disabled = true;
                loginBtn.innerText = 'Authorizing...';

                const response = await fetch('/api/admin/secret-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // লোকাল স্টোরেজে অ্যাডমিন সেশন লক করা
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmailPhone', username);
                    localStorage.setItem('userRole', 'admin');
                    
                    alert('ভেরিফিকেশন সফল! অ্যাডমিন প্যানেলে নিয়ে যাওয়া হচ্ছে...');
                    window.location.href = 'admin.html';
                } else {
                    alert(data.message || 'অ্যাক্সেস ডিনাইড!');
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'Authorize';
                }
            } catch (error) {
                console.error(error);
                alert('সার্ভার কানেকশন ত্রুটি!');
                loginBtn.disabled = false;
                loginBtn.innerText = 'Authorize';
            }
        });
    </script>
</body>
</html>

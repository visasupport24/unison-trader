<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

<body class="app-body">

    <!-- টপ হেডার বার -->

        <div class="header-left">
            <div class="mini-logo">45</div>
            <span class="header-title">45Times</span>
        </div>
        <div class="header-right">
            <i class="far fa-envelope icon-btn" style="font-size: 18px; cursor: pointer;"></i>
            <div class="lang-badge">

        </div>
    </header>

    <!-- ভিআইপি টাস্ক হল এর তালিকা -->
    <main class="task-hall-container">
        <h2 class="task-hall-title">Task Hall</h2>

        <!-- VIP 0 Card (Unlocked) -->
        <div class="vip-card unlocked" onclick="alert('VIP0 এর কাজ শুরু করুন!')">
            <div class="vip-badge-box">
                <span class="badge-num" style="color: #0aa39c;">0</span>
                <span class="badge-text">VIP0</span>
            </div>
            <div class="vip-card-details">
                <p class="unlock-label">Unlock amount:</p>
                <p class="unlock-price">\$0.00</p>
                <p class="vip-level-tag">VIP0</p>
            </div>
            <div class="status-indicator">
                <i class="fas fa-lock-open"></i>
            </div>
        </div>

        <!-- VIP 1 Card -->
        <div class="vip-card locked" onclick="handleLockClick('VIP1', '\$42.00')">
            <div class="vip-badge-box">
                <span class="badge-num">1</span>
                <span class="badge-text">VIP1</span>
            </div>
            <div class="vip-card-details">
                <p class="unlock-label">Unlock amount:</p>
                <p class="unlock-price">\$42.00</p>
                <p class="vip-level-tag">VIP1</p>
            </div>
            <div class="status-indicator">
                <i class="fas fa-lock"></i>
            </div>
        </div>

        <!-- VIP 2 Card -->
        <div class="vip-card locked" onclick="handleLockClick('VIP2', '\$70.00')">
            <div class="vip-badge-box">
                <span class="badge-num">2</span>
                <span class="badge-text">VIP2</span>
            </div>
            <div class="vip-card-details">
                <p class="unlock-label">Unlock amount:</p>
                <p class="unlock-price">\$70.00</p>
                <p class="vip-level-tag">VIP2</p>
            </div>
            <div class="status-indicator">
                <i class="fas fa-lock"></i>
            </div>
        </div>

        <!-- VIP 3 Card -->
        <div class="vip-card locked" onclick="handleLockClick('VIP3', '\$150.00')">
            <div class="vip-badge-box">
                <span class="badge-num">3</span>
                <span class="badge-text">VIP3</span>
            </div>
            <div class="vip-card-details">
                <p class="unlock-label">Unlock amount:</p>
                <p class="unlock-price">\$150.00</p>
                <p class="vip-level-tag">VIP3</p>
            </div>
            <div class="status-indicator">
                <i class="fas fa-lock"></i>
            </div>
        </div>

        <!-- VIP 6 Card -->
        <div class="vip-card locked" onclick="handleLockClick('VIP6', '\$1,730.00')">
            <div class="vip-badge-box">
                <span class="badge-num">6</span>
                <span class="badge-text">VIP6</span>
            </div>
            <div class="vip-card-details">
                <p class="unlock-label">Unlock amount:</p>
                <p class="unlock-price">\$1,730.00</p>
                <p class="vip-level-tag">VIP6</p>

                <i class="fas fa-lock"></i>

        </div>

        <!-- VIP 10 Card -->
        <div class="vip-card locked" onclick="handleLockClick('VIP10', '\$16,830.00')">
            <div class="vip-badge-box">
                <span class="badge-num">10</span>
                <span class="badge-text">VIP10</span>
            </div>
            <div class="vip-card-details">
                <p class="unlock-label">Unlock amount:</p>
                <p class="unlock-price">\$16,830.00</p>

            </div>
            <div class="status-indicator">
                <i class="fas fa-lock"></i>

        </div>
    </main>

    <!-- স্ক্রিনশটের সেই অ্যানিমেটেড গিফট বক্স বাটন -->
    <div class="gift-floating-btn" onclick="alert('ডেইলি লাকি ড্র বা বোনাস অফার!')">
        <i class="fas fa-gift"></i>
    </div>

    <!-- নিচের ফিক্সড নেভিগেশন বার -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="vip.html" class="nav-item active">
            <i class="fas fa-list-alt"></i>

        <a href="#" class="nav-item">

        </a>
        <a href="vip.html" class="nav-item">

            <span>VIP</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Me</span>
        </a>
    </nav>

      <script>
        // সেশন চেক: লগইন না থাকলে ফেরত পাঠানো
        const userEmail = localStorage.getItem('userEmail');
        if (!userEmail) {
            window.location.href = 'index.html';
        }

        // VIP0 টাস্ক কমপ্লিট করার ফাংশন
        async function completeVIP0Task() {
            try {
                const response = await fetch('/api/task/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                const data = await response.json();

                if (data.success) {
                    // লোকাল স্টোরেজে নতুন ব্যালেন্স আপডেট করে দেওয়া
                    localStorage.setItem('userBalance', data.newBalance);
                    alert(data.message);
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert("টাস্ক সাবমিট করতে সমস্যা হয়েছে!");
            }
        }

        // অন্য লকড VIP কার্ডে ক্লিক করার ফাংশন
        function handleLockClick(level, price) {
            alert(`${level} আনলক করতে আপনার অ্যাকাউন্ট থেকে ${price} কেটে নেওয়া হবে। পর্যাপ্ত ব্যালেন্স থাকলে রিচার্জ সেকশনে যান।`);
        }
    </script>
  
</body>
</html>

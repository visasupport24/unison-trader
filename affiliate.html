<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Program - UNISON TRADING</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .affiliate-container { max-width: 500px; margin: 40px auto; padding: 25px; background-color: #181a20; border-radius: 8px; border: 1px solid #2b2f36; }
        .affiliate-container h2 { text-align: center; margin-bottom: 25px; color: #f0b90b; }
        
        /* এফিলিয়েট লিংক বক্স স্টাইল (ছবি ৬ অনুযায়ী) */
        .link-box { background: #0b0e11; border: 1px dashed #f0b90b; padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .link-box input { background: transparent; border: none; color: #eaecef; font-size: 13px; width: 80%; outline: none; font-family: monospace; }
        .btn-link-copy { background: #f0b90b; color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-link-copy:hover { background: #d8a60a; }

        /* টিম এবং কমিশন তথ্য কার্ডসমূহ (ছবি ৬ অনুযায়ী) */
        .info-card { background: #0b0e11; border: 1px solid #2b2f36; padding: 15px; border-radius: 6px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .info-card label { color: #848e9c; font-size: 14px; font-weight: 500; }
        .info-card span { font-size: 18px; font-weight: bold; color: #eaecef; }
        .info-card .commission-highlight { color: #0ecb81; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #848e9c; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #f0b90b; }
    </style>
</head>
<body>

    <div class="affiliate-container">
        <h2>Affiliate Program</h2>

        <!-- এফিলিয়েট লিংক সেকশন (Your Affiliate link) -->
        <label style="display: block; margin-bottom: 5px; color: #848e9c; font-size: 14px;">Your Affiliate Link</label>
        <div class="link-box">
            <input type="text" id="affiliateLink" readonly value="Loading link...">
            <button type="button" class="btn-link-copy" onclick="copyAffiliateLink()">Copy</button>
        </div>

        <!-- টিম মেম্বার কাউন্টার (Team member) -->
        <div class="info-card">
            <label>Team Member</label>
            <span id="teamMemberCount">0 Person</span>
        </div>

        <!-- আজকের রেফারেল কমিশন (Todays commission) -->
        <div class="info-card">
            <label>Todays Commission</label>
            <span id="todaysCommissionAmt" class="commission-highlight">0.00 USDT</span>
        </div>

        <a href="/dashboard" class="back-link">← ফিরে যান ড্যাশবোর্ডে</a>
    </div>

    <script>
        // সিকিউরিটি চেক
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = '/login';
        }

        const email_phone = localStorage.getItem('userEmailPhone');

        // এফিলিয়েট ডেটা এবং ডাইনামিক লিংক তৈরি
        async function loadAffiliateData() {
            try {
                const response = await fetch(`/api/user/dashboard?email_phone=${encodeURIComponent(email_phone)}`);
                const data = await response.json();
                
                if (data.success) {
                    // ডাইনামিক এফিলিয়েট লিংক তৈরি (ইউজারের ইমেইল/ফোন প্যারামিটার হিসেবে ব্যবহার করে)
                    const currentDomain = window.location.origin;
                    document.getElementById('affiliateLink').value = `${currentDomain}/register?ref=${encodeURIComponent(email_phone)}`;
                    
                    // টিম মেম্বার এবং কমিশন লাইভ আপডেট করা
                    document.getElementById('teamMemberCount').innerText = `${data.user.team_member} Person`;
                    document.getElementById('todaysCommissionAmt').innerText = `${parseFloat(data.user.todays_commission).toFixed(2)} USDT`;
                }
            } catch (error) {
                console.error('এফিলিয়েট ডেটা লোড করা যায়নি:', error);
            }
        }

        // পেজ লোড হলে রান হবে
        loadAffiliateData();

        // লিংক কপি করার ফাংশน
        function copyAffiliateLink() {
            const linkInput = document.getElementById('affiliateLink');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999); // মোবাইল ডিভাইসের জন্য
            
            navigator.clipboard.writeText(linkInput.value).then(() => {
                alert('আপনার এফিলিয়েট লিংকটি কপি হয়েছে! বন্ধুদের সাথে শেয়ার করুন।');
            }).catch(err => {
                console.error('কপি করা যায়নি:', err);
            });
        }
    </script>
</body>
</html>

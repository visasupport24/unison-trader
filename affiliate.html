<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate - Unison Trading</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <script>if (!localStorage.getItem('token')) { window.location.href = 'login.html'; }</script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col pb-24">
    <header class="w-full max-w-md mx-auto p-4 flex items-center border-b border-gray-800">
        <a href="dashboard.html" class="text-gray-400 mr-3"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="text-sm font-bold text-yellow-500 uppercase">Affiliate Center</h2>
    </header>
    <main class="w-full max-w-md mx-auto p-4 space-y-5">
        <div class="bg-gray-800 border border-gray-700 p-4 rounded-xl">
            <label class="block text-xs font-bold text-gray-400 mb-2">Your Affiliate Link</label>
            <div class="flex gap-2">
                <input type="text" id="referralLink" readonly value="" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-1.5 text-xs text-yellow-500 font-mono focus:outline-none">
                <button onclick="copyLink()" class="bg-yellow-500 text-gray-900 px-4 py-1.5 rounded-lg text-xs font-bold shrink-0">Copy</button>
            </div>
        </div>
        <div class="bg-yellow-500/5 border border-yellow-500/20 rounded-xl p-4">
            <h4 class="text-xs font-bold text-yellow-500 mb-2">📋 গুরুত্বপূর্ণ নিয়মাবলী</h4>
            <ul class="list-disc list-inside text-[11px] text-gray-300 space-y-1.5">
                <li>মেম্বার বোনাস ৫% এবং ডেইলি কমিশন ২৫%।</li>
                <li>কমিশন ব্যালেন্স শুধুমাত্র প্রতি <span class="text-green-400 font-bold">শুক্রবার</span> উইথড্র করা যাবে।</li>
                <li>প্রতিটি উইথড্রয়ালে ৩% ফি প্রযোজ্য হবে।</li>
            </ul>
        </div>
    </main>
    <nav class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 py-2.5 px-4 z-50">
        <div class="w-full max-w-md mx-auto flex justify-between text-center text-gray-400">
            <a href="index.html" class="w-1/4"><i class="fa-solid fa-house text-lg"></i></a>
            <a href="dashboard.html" class="w-1/4"><i class="fa-solid fa-chart-pie text-lg"></i></a>
            <a href="profile.html" class="w-1/4 text-yellow-500"><i class="fa-solid fa-user text-lg"></i></a>
            <a href="about.html" class="w-1/4"><i class="fa-solid fa-circle-info text-lg"></i></a>
        </div>
    </nav>
    <script>
        window.onload = function() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                document.getElementById('referralLink').value = `${window.location.protocol}//${window.location.host}/register.html?ref=${user.id}`;
            }
        }
        function copyLink() {
            const copyText = document.getElementById("referralLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Referral Link Copied!");
        }
    </script>
</body>
</html>

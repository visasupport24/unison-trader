<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate - Unison Trading</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="styles.css">
    <script>if (!localStorage.getItem('token')) { window.location.href = 'login.html'; }</script>
</head>
<body class="pb-5">
    <header class="w-100 max-w-md mx-auto p-3 d-flex align-items-center border-bottom border-secondary">
        <a href="dashboard.html" class="text-secondary me-3"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="h6 font-weight-bold text-yellow uppercase m-0">Affiliate Center</h2>
    </header>
    <main class="w-100 max-w-md mx-auto p-3 vstack gap-4">
        <div class="card-custom p-3 shadow-sm">
            <label class="form-label text-secondary small fw-bold">Your Affiliate Link</label>
            <div class="input-group">
                <input type="text" id="referralLink" readonly class="form-control form-control-custom text-yellow font-monospace small">
                <button onclick="copyLink()" class="btn btn-yellow">Copy</button>
            </div>
        </div>
        <div class="card-custom p-3 shadow-sm bg-opacity-10 border-warning">
            <h4 class="h6 text-warning fw-bold mb-2">📋 গুরুত্বপূর্ণ নিয়মাবলী</h4>
            <ul class="list-unstyled small text-light space-y-2 mb-0">
                <li><i class="fa-solid fa-check text-success me-1"></i> মেম্বার ফার্স্ট ডিপোজিট বোনাস ৫%</li>
                <li><i class="fa-solid fa-check text-success me-1"></i> টিম ডেইলি কমিশন বোনাস ২৫%</li>
                <li><i class="fa-solid fa-check text-success me-1"></i> কমিশন ব্যালেন্স শুধুমাত্র প্রতি <span class="text-success fw-bold">শুক্রবার</span> উইথড্র করা যাবে।</li>
                <li><i class="fa-solid fa-check text-success me-1"></i> প্রতিটি উইথড্রয়ালে ৩% প্রসেসিং ফি প্রযোজ্য হবে।</li>
            </ul>
        </div>
    </main>
    <nav class="fixed-bottom nav-bottom py-2 shadow-lg">
        <div class="w-100 max-w-md mx-auto d-flex justify-around text-center text-secondary small">
            <a href="index.html" class="text-secondary text-decoration-none"><i class="fa-solid fa-house h5 d-block m-0"></i>Home</a>
            <a href="dashboard.html" class="text-secondary text-decoration-none"><i class="fa-solid fa-chart-pie h5 d-block m-0"></i>Dashboard</a>
            <a href="profile.html" class="text-secondary text-decoration-none"><i class="fa-solid fa-user h5 d-block m-0"></i>Profile</a>
            <a href="about.html" class="text-secondary text-decoration-none"><i class="fa-solid fa-circle-info h5 d-block m-0"></i>About</a>
        </div>
    </nav>
    <script>
        window.onload = function() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                document.getElementById('referralLink').value = `${window.location.protocol}//${window.location.host}/register.html?ref=${user.id}`;
            }
        }
        function copyLink() {
            const copyText = document.getElementById("referralLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Referral Link Copied!");
        }
    </script>
</body>
</html>

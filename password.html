<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45Times - Change Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="app-body">

    <!-- টপ হেডার বার -->
    <header class="app-header">
        <div class="header-left">
            <a href="profile.html" style="color: white; text-decoration: none;"><i class="fas fa-chevron-left"></i> Back</a>
            <span class="header-title" style="margin-left: 15px;">Change Password</span>
        </div>
    </header>

    <main style="padding: 16px;">
        <!-- পাসওয়ার্ড পরিবর্তন ফর্ম -->
        <div style="background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); margin-top: 10px;">
            <h3 style="font-size: 16px; margin-bottom: 20px; color: #2c3e50;"><i class="fas fa-key" style="color: #74b9ff;"></i> Update Security Password</h3>
            
            <form id="passwordForm">
                <div class="input-group">
                    <label>Current Password (বর্তমান পাসওয়ার্ড)</label>
                    <div class="password-wrapper">
                        <input type="password" id="currentPassword" placeholder="Enter current password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>New Password (নতুন পাসওয়ার্ড)</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Confirm New Password (নতুন পাসওয়ার্ড নিশ্চিত করুন)</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required>
                    </div>
                </div>

                <button type="submit" class="btn-signin" style="margin-top: 10px; background-color: #2c3e50;">Update Password</button>
            </form>
        </div>
    </main>

    <script>
        const userEmail = localStorage.getItem('userEmail');
        if (!userEmail) window.location.href = 'index.html';

        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            // নতুন পাসওয়ার্ড দুটি মিলছে কিনা ফ্রন্টএন্ড ভ্যালিডেশন
            if (newPassword !== confirmNewPassword) {
                alert("নতুন পাসওয়ার্ড এবং কনফার্ম পাসওয়ার্ড মিলছে না!");
                return;
            }

            if (newPassword.length < 6) {
                alert("নিরাপত্তার জন্য নতুন পাসওয়ার্ড নূন্যতম ৬ অক্ষরের হতে হবে!");
                return;
            }

            try {
                const response = await fetch('/api/user/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, currentPassword, newPassword })
                });
                const data = await response.json();
                
                if (data.success) {
                    alert(data.message);
                    localStorage.clear(); // নিরাপত্তার জন্য সেশন ক্লিয়ার করে নতুন পাসওয়ার্ড দিয়ে লগইন করতে বাধ্য করা
                    window.location.href = 'index.html';
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert("সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না!");
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Registration Page</title>
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <div class="card">
            <h2 style="text-align: center; color: var(--accent-gold);">Registration Page</h2>
            <div style="display:flex; justify-content: space-around; margin-bottom: 20px; font-weight: bold; border-bottom: 1px solid #fff; padding-bottom: 5px;">
                <span style="color: var(--accent-gold); cursor:pointer;">Email Registration</span>
                <span style="opacity: 0.5; cursor:pointer;">Phone Registration</span>
            </div>
            <form action="/api/register" method="POST">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn" style="width:100%;">Sign Up</button>
            </form>
        </div>
    </div>
</body>
</html>

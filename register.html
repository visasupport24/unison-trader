<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Unison Trading</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-center items-center p-4">
    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-yellow-500">UNISON TRADING</h1>
            <p class="text-gray-400 text-sm mt-1">Registration Page</p>
        </div>
        <div class="flex border-b border-gray-700 mb-6 text-center">
            <button class="w-1/2 pb-2 border-b-2 border-yellow-500 font-semibold text-yellow-500">Email Registration</button>
            <button class="w-1/2 pb-2 text-gray-400 font-semibold" onclick="alert('Phone Registration coming soon!')">Phone Registration</button>
        </div>
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input type="email" id="email" required placeholder="Enter your email" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="Enter password" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-500">
                    <button type="button" id="togglePassword" class="absolute right-3 top-2.5 text-gray-400"><i class="fa-solid fa-eye" id="eyeIcon"></i></button>
                </div>
            </div>
            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2.5 rounded-lg transition transform active:scale-95">Sign UP</button>
        </form>
        <div class="text-center mt-6 text-sm text-gray-400">Already have an account? <a href="login.html" class="text-yellow-500 hover:underline font-medium">Sign In</a></div>
    </div>
    <script>
        const passwordInput = document.getElementById('password');
        document.getElementById('togglePassword').addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            document.getElementById('eyeIcon').classList.toggle('fa-eye');
            document.getElementById('eyeIcon').classList.toggle('fa-eye-slash');
        });
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = passwordInput.value;
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (data.success) { alert(data.message); window.location.href = 'login.html'; } 
                else { alert(data.message); }
            } catch (error) { alert("Registration failed. Try again."); }
        });
    </script>
</body>
</html>

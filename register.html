<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Unison Trading</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-screen p-3">
    <div class="card card-custom w-100 p-4 shadow" style="max-width: 400px;">
        <div class="text-center mb-4">
            <h1 class="h3 font-weight-bold text-yellow">UNISON TRADING</h1>
            <p class="text-secondary small mt-1">Registration Page</p>
        </div>
        <div class="d-flex border-bottom border-secondary mb-4 text-center">
            <button class="w-50 pb-2 btn text-yellow fw-bold border-bottom border-2 border-yellow rounded-0">Email</button>
            <button class="w-50 pb-2 btn text-secondary fw-bold rounded-0" onclick="alert('Phone Registration coming soon!')">Phone</button>
        </div>
        <form id="registerForm" class="vstack gap-3">
            <div>
                <label class="form-label text-light small mb-1">Email</label>
                <input type="email" id="email" required placeholder="Enter your email" class="form-control form-control-custom py-2">
            </div>
            <div>
                <label class="form-label text-light small mb-1">Password</label>
                <div class="input-group">
                    <input type="password" id="password" required placeholder="Enter password" class="form-control form-control-custom py-2">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword"><i class="fa-solid fa-eye text-light" id="eyeIcon"></i></button>
                </div>
            </div>
            <button type="submit" class="btn btn-yellow w-100 py-2.5 mt-2 shadow-sm">Sign UP</button>
        </form>
        <div class="text-center mt-4 small text-secondary">Already have an account? <a href="login.html" class="text-yellow text-decoration-none fw-medium ms-1">Sign In</a></div>
    </div>
    <script>
        const passwordInput = document.getElementById('password');
        document.getElementById('togglePassword').addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            document.getElementById('eyeIcon').classList.toggle('fa-eye');
            document.getElementById('eyeIcon').classList.toggle('fa-eye-slash');
        });
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = passwordInput.value;
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (data.success) { alert(data.message); window.location.href = 'login.html'; } 
                else { alert(data.message); }
            } catch (error) { alert("Registration failed."); }
        });
    </script>
</body>
</html>
